name: Main Validation
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build -c Release --no-restore
    - name: Run OpenAPI Contract Tests
      run: dotnet test tests/architecture/Emcore.OpenApi.Tests/Emcore.OpenApi.Tests.csproj -c Release --no-build --logger trx
    - name: Run Gateway Integration Tests
      run: dotnet test gateways/Emcore.ApiGateway.Tests/Emcore.ApiGateway.Tests.csproj -c Release --no-build --logger trx
    - name: Run Full Regression Tests
      run: dotnet test Emcore.Platform.slnx -c Release --no-build --logger trx
    - name: Verify OpenAPI Contract Export & Schema Validation
      run: |
        chmod +x ./scripts/Generate-OpenApi.sh
        ./scripts/Generate-OpenApi.sh
    - name: Check OpenAPI Contract Compatibility
      shell: pwsh
      run: ./scripts/Check-OpenApiCompatibility.ps1 -BaselineDir "docs/verification/swagger-safe-remediation/baseline-contracts" -CurrentDir "contracts/openapi"
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: '**/*.trx'
    - name: Upload Generated OpenAPI Contracts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: emcore-openapi-specs
        path: contracts/openapi/
