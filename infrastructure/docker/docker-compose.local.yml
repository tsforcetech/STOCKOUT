services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: emcore-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - rabbitmq

  redis:
    image: redis:7.2-alpine
    container_name: emcore-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - redis

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: emcore-opensearch
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD:-Admin123!}
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:9200"]
      interval: 15s
      timeout: 5s
      retries: 5
    profiles:
      - opensearch

  minio:
    image: minio/minio
    container_name: emcore-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:-admin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - minio

  otel:
    image: otel/opentelemetry-collector:0.100.0
    container_name: emcore-otel
    ports:
      - "4317:4317"
      - "4318:4318"
    profiles:
      - otel

volumes:
  rabbitmq_data:
  redis_data:
  opensearch_data:
  minio_data:
